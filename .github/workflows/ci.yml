name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run pre-commit checks
        run: python -m pre_commit run --all-files --show-diff-on-failure

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Build, smoke-test, and test Docker image
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          tags: web-metrics-scraper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check container entry point
        run: docker run --rm web-metrics-scraper:ci --help

      - name: Run offline tests in container
        run: |
          docker run --rm \
            --volume "$PWD/tests:/app/tests:ro" \
            --volume "$PWD/.config.example:/app/.config.example:ro" \
            --entrypoint python3 \
            web-metrics-scraper:ci \
            -m unittest discover -s /app/tests -v
